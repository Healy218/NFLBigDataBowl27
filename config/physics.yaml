# Physics constants & modelling assumptions for drill -> Joule reconstruction.
#
# Every entry is a parameter block:
#   value: default used in the main pipeline
#   low / high: bounds for the sensitivity sweep (omit both => fixed, not swept)
#   units, note: provenance and caveats
#
# Definitional constants (unit conversions, standard gravity G = 9.80665,
# bar mass 225 lb = 102.058 kg) live in src/eeg/ingest/units.py, not here.
# They are exact, and a uniform scale on every prospect cannot change rankings.
#
# Rule: if prospect rankings flip (Spearman < pipeline.spearman_min) when one
# parameter moves within its bounds, that parameter needs better grounding
# before Phase 3. See reports/phase2_physics_notes.md.

vertical:
  # Sayers et al. (1999): P_peak [W] = a * h[cm] + b * m[kg] + c
  # Peak power channel only; never summed with Joules.
  sayers_a:
    value: 60.7
    units: W/cm
    note: Sayers et al. 1999, published coefficient
  sayers_b:
    value: 45.3
    units: W/kg
    note: Sayers et al. 1999, published coefficient
  sayers_c:
    value: -2055.0
    units: W
    note: Sayers et al. 1999, published intercept
  sayers_out_of_sample_groups:
    value: [OL, DL]
    note: >
      Sayers was fit on a general athletic sample; 140-160 kg linemen are
      extrapolation. Rows in these groups get sayers_extrapolated = True.

broad:
  theta_deg:
    value: 45.0
    low: 30.0
    high: 45.0
    units: deg
    note: >
      Takeoff angle. 45 deg minimises required v0, so the default is a LOWER
      bound on takeoff KE. Measured standing long-jump angles are ~30-40 deg.
      At 30 deg, E is ~15% higher (sin 2θ = 0.866).

sprint:
  distance_yd:
    value: 40.0
    units: yd
    note: Combine 40-yard dash; electronic timing starts at first movement
  fit_strategy:
    value: [tracking]
    note: >
      (v_max, tau, t0) in v(t) = v_max (1 - exp(-(t - t0)/tau)) are fit to the
      10 Hz speed trace; t0 is free because the tracked window starts before
      the official clock. 418 of 424 prospects with an official 40 have a
      trace. The other 6 get no E_40: fitting the official 10-yd split + 40
      instead is biased against tracking (v_max ~0.5-0.8 m/s low, tau r ~0.06-0.26,
      even after a per-year timing offset), so it is not used as a fallback.
  max_fit_rmse_mps:
    value: 0.4
    units: m/s
    note: >
      Reps whose speed fit RMSE exceeds this are excluded before choosing a
      player's best rep (13 of 793 reps; median RMSE 0.18 m/s).
  air_density:
    value: 1.18
    low: 1.15
    high: 1.20
    units: kg/m^3
    note: >
      Lucas Oil Stadium, Indianapolis, indoors: ~220 m elevation, ~20 C
      (ideal gas gives ~1.17-1.18). Bounds cover 18-26 C and pressure swings.
  drag_coefficient:
    value: 0.9
    low: 0.8
    high: 1.0
    units: dimensionless
    note: Samozino et al. 2016 sprint-profiling convention
  frontal_area_bsa_factor:
    value: 0.266
    low: 0.24
    high: 0.29
    units: dimensionless
    note: >
      A = factor * BSA, with Du Bois BSA = 0.2025 h^0.725 m^0.425 (h in m,
      m in kg). Expect A ~0.54 m^2 (85 kg DB) to ~0.72 m^2 (140 kg OL).

cod:
  # 170 (shuttle) / 160 (cone) prospects have 10 Hz tracking, so turn speeds
  # are measured: W_cod = ½ m Σ|Δ(v²)| (src/eeg/physics/cod.py).
  min_leg_yd:
    value: 2.5
    units: yd
    note: >
      A valid rep must reach this far along the first leg and (shuttle) the far
      leg or (3-cone) laterally round cone 3. Measured turn points sit ~1 yd
      short of the lines (shuttle ~3.7 / -3.6 yd, cone loop ~5.5 yd), so this
      only rejects truncated or aborted windows.
  finish_tol_yd:
    value: 1.0
    units: yd
    note: >
      If the window ends before the sensor re-crosses the start line, the
      window end is the finish when it is within this distance of the line.
  min_finish_speed_ratio:
    value: 0.8
    units: dimensionless
    note: >
      A real rep sprints through the line (finish speed > 0.9 v_peak in ~90%
      of reps). Reps finishing below this fraction of their peak speed were
      jogged out: they run 0.9-1.8 s over the official time, so they are invalid.
  onset_speed_mps:
    value: 1.0
    units: m/s
    note: >
      Tracked time runs from the first frame at this speed to the finish; the
      window itself starts ~0.2 s earlier than the official clock.
  fit_strategy:
    value: [tracking]
    note: >
      W_cod is measured from the speed trace only. 156 prospects per drill get
      it. The k-factor model (v_i = k * segment distance / segment time, from
      the official time) is not used as a fallback for the ~40 / ~30 with only
      an official time: within position groups it ranks tracked W_cod at
      Spearman 0.07-0.56, worse than mass alone. Within a drill it reduces to
      W ∝ m / T², so k only rescales and was never a ranking parameter.
  count_braking_work:
    value: absolute
    note: Eccentric (braking) work counted as |W|; real muscular effort

bench:
  rom_arm_fraction:
    value: 0.50
    low: 0.40
    high: 0.55
    units: dimensionless
    note: >
      ROM = alpha * Combine arm length (shoulder to fingertip, ~0.81-0.91 m),
      giving bar travel ~0.35-0.50 m. Concentric work only. Calibrate against
      published bench ROM data if possible.

mass:
  lab_mass_source:
    value: combine_weigh_in
    note: >
      All lab Joules use Combine weigh-in mass. The competition data has no
      in-season weight, so Phase 4 field energy must use Combine mass too.

pipeline:
  composite_min_drills:
    value: 3
    units: drills
    note: Need >= 3 of 6 drill channels for a composite; record n_drills
  zscore_within:
    value: combine_year
    note: Cohort z-scores so timing/surface drift across years is not signal
  outlier_sd:
    value: 4.0
    units: SD
    note: Sanity-pass flag threshold
  spearman_min:
    value: 0.9
    units: dimensionless
    note: Minimum rank stability across sensitivity bounds

clustering:
  # Phase 3 feature matrix (src/eeg/clustering/features.py). Each feature is
  # log(value) with its pooled log-log mass trend removed (slope fit within
  # combine_year, no positions), then z-scored within combine_year. log mass
  # is added as one explicit feature. Prospects missing any feature are dropped.
  features:
    value: [E_vert, E_broad, v_max, tau]
    note: >
      Core drills with the widest coverage (369 complete). E_40 is left out:
      its mass residual correlates 1.00 with v_max's. Sayers power is ~linear
      in jump height and mass (r 0.99 with E_vert), so it is reporting-only.
      tau is noisy in 2024 (log SD ~2x 2023/2025), which the within-year
      z-score scales down but does not remove.
  descriptors:
    value: [E_40, W_bench, W_cod_shuttle, W_cod_cone]
    note: >
      Same mass-residual z-scores, computed on each channel's own rows, used
      only to describe fitted archetypes. Too sparse to define them (core +
      bench 146, core + both COD drills 89) and imputing would leak position,
      since who skips bench or agility drills depends on position.
