# Physics constants & modelling assumptions for drill -> Joule reconstruction.
#
# Every entry is a parameter block:
#   value: default used in the main pipeline
#   low / high: bounds for the sensitivity sweep (omit both => fixed, not swept)
#   units, note: provenance and caveats
#
# Definitional constants (unit conversions, standard gravity G = 9.80665,
# bar mass 225 lb = 102.058 kg) live in src/eeg/ingest/units.py, not here.
# They are exact, and a uniform scale on every prospect cannot change rankings.
#
# Rule: if prospect rankings flip (Spearman < pipeline.spearman_min) when one
# parameter moves within its bounds, that parameter needs better grounding
# before Phase 3. See reports/phase2_physics_notes.md.

vertical:
  # Sayers et al. (1999): P_peak [W] = a * h[cm] + b * m[kg] + c
  # Peak power channel only; never summed with Joules.
  sayers_a:
    value: 60.7
    units: W/cm
    note: Sayers et al. 1999, published coefficient
  sayers_b:
    value: 45.3
    units: W/kg
    note: Sayers et al. 1999, published coefficient
  sayers_c:
    value: -2055.0
    units: W
    note: Sayers et al. 1999, published intercept
  sayers_out_of_sample_groups:
    value: [OL, DL]
    note: >
      Sayers was fit on a general athletic sample; 140-160 kg linemen are
      extrapolation. Rows in these groups get sayers_extrapolated = True.

broad:
  theta_deg:
    value: 45.0
    low: 30.0
    high: 45.0
    units: deg
    note: >
      Takeoff angle. 45 deg minimises required v0, so the default is a LOWER
      bound on takeoff KE. Measured standing long-jump angles are ~30-40 deg.
      At 30 deg, E is ~15% higher (sin 2θ = 0.866).

sprint:
  distance_yd:
    value: 40.0
    units: yd
    note: Combine 40-yard dash; electronic timing starts at first movement
  fit_strategy:
    value: [tracking]
    note: >
      (v_max, tau, t0) in v(t) = v_max (1 - exp(-(t - t0)/tau)) are fit to the
      10 Hz speed trace; t0 is free because the tracked window starts before
      the official clock. 418 of 424 prospects with an official 40 have a
      trace. The other 6 get no E_40: fitting the official 10-yd split + 40
      instead is biased against tracking (v_max ~0.5-0.8 m/s low, tau r ~0.06-0.26,
      even after a per-year timing offset), so it is not used as a fallback.
  max_fit_rmse_mps:
    value: 0.4
    units: m/s
    note: >
      Reps whose speed fit RMSE exceeds this are excluded before choosing a
      player's best rep (13 of 793 reps; median RMSE 0.18 m/s).
  air_density:
    value: 1.18
    low: 1.15
    high: 1.20
    units: kg/m^3
    note: >
      Lucas Oil Stadium, Indianapolis, indoors: ~220 m elevation, ~20 C
      (ideal gas gives ~1.17-1.18). Bounds cover 18-26 C and pressure swings.
  drag_coefficient:
    value: 0.9
    low: 0.8
    high: 1.0
    units: dimensionless
    note: Samozino et al. 2016 sprint-profiling convention
  frontal_area_bsa_factor:
    value: 0.266
    low: 0.24
    high: 0.29
    units: dimensionless
    note: >
      A = factor * BSA, with Du Bois BSA = 0.2025 h^0.725 m^0.425 (h in m,
      m in kg). Expect A ~0.54 m^2 (85 kg DB) to ~0.72 m^2 (140 kg OL).

cod:
  # 170 (shuttle) / 160 (cone) prospects have 10 Hz tracking, so turn speeds
  # are measured: W_cod = ½ m Σ|Δ(v²)| (src/eeg/physics/cod.py).
  min_leg_yd:
    value: 2.5
    units: yd
    note: >
      A valid rep must reach this far along the first leg and (shuttle) the far
      leg or (3-cone) laterally round cone 3. Measured turn points sit ~1 yd
      short of the lines (shuttle ~3.7 / -3.6 yd, cone loop ~5.5 yd), so this
      only rejects truncated or aborted windows.
  finish_tol_yd:
    value: 1.0
    units: yd
    note: >
      If the window ends before the sensor re-crosses the start line, the
      window end is the finish when it is within this distance of the line.
  min_finish_speed_ratio:
    value: 0.8
    units: dimensionless
    note: >
      A real rep sprints through the line (finish speed > 0.9 v_peak in ~90%
      of reps). Reps finishing below this fraction of their peak speed were
      jogged out: they run 0.9-1.8 s over the official time, so they are invalid.
  onset_speed_mps:
    value: 1.0
    units: m/s
    note: >
      Tracked time runs from the first frame at this speed to the finish; the
      window itself starts ~0.2 s earlier than the official clock.
  fit_strategy:
    value: [tracking]
    note: >
      W_cod is measured from the speed trace only. 156 prospects per drill get
      it. The k-factor model (v_i = k * segment distance / segment time, from
      the official time) is not used as a fallback for the ~40 / ~30 with only
      an official time: within position groups it ranks tracked W_cod at
      Spearman 0.07-0.56, worse than mass alone. Within a drill it reduces to
      W ∝ m / T², so k only rescales and was never a ranking parameter.
  count_braking_work:
    value: absolute
    note: Eccentric (braking) work counted as |W|; real muscular effort

bench:
  rom_arm_fraction:
    value: 0.50
    low: 0.40
    high: 0.55
    units: dimensionless
    note: >
      ROM = alpha * Combine arm length (shoulder to fingertip, ~0.81-0.91 m),
      giving bar travel ~0.35-0.50 m. Concentric work only. Calibrate against
      published bench ROM data if possible.

mass:
  lab_mass_source:
    value: combine_weigh_in
    note: >
      All lab Joules use Combine weigh-in mass. The competition data has no
      in-season weight, so Phase 4 field energy must use Combine mass too.

pipeline:
  composite_min_drills:
    value: 3
    units: drills
    note: Need >= 3 of 6 drill channels for a composite; record n_drills
  zscore_within:
    value: combine_year
    note: Cohort z-scores so timing/surface drift across years is not signal
  outlier_sd:
    value: 4.0
    units: SD
    note: Sanity-pass flag threshold
  spearman_min:
    value: 0.9
    units: dimensionless
    note: Minimum rank stability across sensitivity bounds

clustering:
  # Phase 3 feature matrix (src/eeg/clustering/features.py). Each feature is
  # log(value) with its pooled trend in log mass removed (mass_trend_degree; fit within
  # combine_year, no positions), then z-scored within combine_year. log mass
  # is added as one explicit feature. Prospects missing any feature are dropped.
  features:
    value: [E_vert, E_broad, v_max, tau]
    note: >
      Core drills with the widest coverage (369 complete). E_40 is left out:
      its mass residual correlates 1.00 with v_max's. Sayers power is ~linear
      in jump height and mass (r 0.99 with E_vert), so it is reporting-only.
      tau is noisy (rep-to-rep r 0.51 vs 0.97 for v_max) and widest in 2024,
      but valid: with v_max held fixed it correlates 0.58 with the official
      10-yd split (0.65 in 2024), so it stays (reports/feature_audit.md).
  mass_trend_degree:
    value: 2
    units: polynomial degree in log mass
    note: >
      Quadratic in log mass. A power law (degree 1) is curved in the data:
      middle-mass prospects sit 0.4-0.6 SD above it on vert, broad and v_max
      (x² F 39-77), so degree-1 residuals still depend on mass non-linearly and
      K-Means finds "explosive middle-mass" as a cluster. Degree 2 removes that
      (decided 2026-10-18; see reports/phase3_profiles_notes.md, decision C).
  profile_axes:
    value: 3
    units: principal axes of the engine features
    note: >
      Kinetic profile axes kept (src/eeg/clustering/profiles.py) and the degrees
      of freedom of the Kinetic Anomaly score. The fourth axis is mostly tau
      rep-to-rep noise (score reliability ~0.35 vs 0.73-0.95 for axes 1-3), so it
      would make the anomaly score partly a noise score.
  descriptors:
    value: [E_40, W_bench, W_cod_shuttle, W_cod_cone]
    note: >
      Same mass-residual z-scores, computed on each channel's own rows, used
      only to describe the profiles. Too sparse to define them (core +
      bench 146, core + both COD drills 89) and imputing would leak position,
      since who skips bench or agility drills depends on position.

lab_burst:
  # Which Combine measure of the start to use from Iteration 4 on (src/eeg/physics/burst.py).
  measure:
    value: a10
    units: m/s^2
    note: >
      Mean acceleration over the first 10 yd from rest, a10 = 2 d10 / t10^2,
      from the official 10-yard split (a monotone transform of it). Within
      group it tracks field burst (r 0.36) and DL get-off (r -0.67) better
      than any tracked start measure (best: mean of reps of the sustained
      a_s peak, 0.23 / -0.45; tau alone ~0). For get-off it carries the signal
      beyond top speed (beta 0.63 with v_max at -0.05). Covers 425 prospects.
      Tracked reps stay noisy even averaged (mean-of-2 reliability 0.62-0.73).
      The clustering keeps v_max + tau: with v_max fixed, tau does carry the
      start (beta 0.31 for get-off). η_burst keeps the same-estimator lab
      peak; a10 is a predictor, not an η denominator (decided 2026-10-22,
      reports/lab_burst.md).
games:
  # Game tracking ingest (src/eeg/ingest/load_games.py). Glitch frames are
  # flagged, never dropped; downstream code decides what to exclude.
  season_types:
    value: [REG]
    note: >
      Regular season only: the competition brief targets "performance on the
      field during the NFL regular season" (decided 2026-10-22; POST was 4.6%
      of player-games). Preseason was dropped earlier: ~45-65 plays per
      prospect per season, and effort and rosters are not comparable.
  frame_dt_s:
    value: 0.1
    units: s
    note: 10 Hz. Steps of any other length are flagged as gaps (3 of 3.6 M in 2023 REG + POST)
  max_speed_mps:
    value: 11.0
    units: m/s
    note: >
      ~12.0 yd/s, ~24.6 mph: above the fastest Combine 40 frame (10.8 m/s) and
      the fastest in-game NGS speeds (~10.5 m/s). Reported speed above it, or an
      x/y step implying it (teleports at the snap), is a glitch.
  max_accel_mps2:
    value: 12.0
    units: m/s^2
    note: >
      Above elite sprint-start acceleration (~8-10 m/s^2). Reported p99.999 is
      ~9.2 m/s^2 (2025 REG + POST). Applied to reported a and to a_s (smoothed
      d(speed)/dt), which catches reported speed jumping while a stays 0.
  accel_window_frames:
    value: 5
    units: frames (10 Hz)
    note: >
      Savitzky-Golay window (polyorder 2) for signed tangential acceleration,
      d(reported speed)/dt, applied identically to game tracks and Combine 40
      traces (src/eeg/ngs/kinematics.py). NGS `a` can't be used: it is total
      acceleration magnitude (r 0.88 with |a| from x/y, 0.61 with |dv/dt|), so it
      includes turning and has no braking sign. 0.5 s keeps burst peaks; the
      window sensitivity is in reports/field_kinematics.md.
  max_speed_mismatch_mps:
    value: 1.0
    units: m/s
    note: >
      Reported speed vs speed from central x/y differences. They agree within
      ~1-2% above 8 m/s (|gap| p99.9 0.63 m/s in clean 2024 REG tracks). A quality
      flag, not a glitch: most flagged frames are low-speed contact, where
      positions stop abruptly and the smoothed reported speed lags.
  sustain_frames:
    value: 3
    units: frames (10 Hz)
    note: >
      A peak (speed, acceleration, power) counts only if held for this many
      consecutive frames (rolling minimum), so a one-frame spike can't set it.
      Same on the field and on the 40 (src/eeg/ngs/channels.py, validate.py).
  burst_window_s:
    value: 1.5
    units: s after the snap
    note: >
      Burst acceleration is the sustained peak of a_s in [0, burst_window_s]
      after the snap. 55% of season peak accelerations fall in this window
      (reports/field_kinematics.md).
  burst_start_speed_mps:
    value: 1.0
    units: m/s
    note: >
      A play is burst-eligible only if the player is below this speed at the
      snap (a start from near rest, like the 40). Excludes pre-snap motion.
  min_game_plays:
    value: 5
    units: plays
    note: >
      Games with fewer plays (11%, mostly special-teams cameos) don't enter
      season statistics: their maxima are jogs, and they drag single-game
      reliability of top speed to ~0.04 (0.16 with the filter). Season-level
      reliability barely moves (reports/field_reliability.md).
  min_season_plays:
    value: 100
    units: plays
    note: A player-season needs this many plays (in games that count) to get field channels and η
  min_season_games:
    value: 6
    units: games
    note: >
      And this many games that count. Set under the game-based top3
      statistic: over 6 games its within-position reliability is 0.60 for
      speed and 0.74-0.79 for burst and power (REG only), and speed reaches
      0.68 at 8. 6 rather than 4 costs ~13 player-seasons
      (reports/field_reliability.md, exposure curve). Kept with top3_of50 so
      a season value spans several games.
  season_statistic:
    value: top3_of50
    note: >
      Season value of every field channel: expected mean of the 3 best plays
      in 50 plays drawn at random from the season (`season_sample_plays`),
      computed exactly over all 50-play subsets. Replaces top3 (mean of the 3
      highest game maxima, decided 2026-10-21): maxima over games grow with
      exposure, so top3 η rose with playing time (within-group r +0.46 with
      season plays) and step 5 would have credited η for playing time it
      measured. The fixed-K value is the same functional for every player
      (r −0.06 with plays for speed) and, for speed, is also more reliable:
      split-half 0.84 vs 0.80, η 0.75 vs 0.67, season retest 0.77 vs 0.61.
      Decided 2026-10-22 (reports/field_reliability.md).
  season_sample_plays:
    value: 50
    units: plays
    note: >
      K of the season statistic. Every qualified season has ≥ 79 burst-eligible
      plays, so 50 defines every channel; within-group r with plays is −0.07
      (25), −0.07 (50), −0.05 (75), −0.03 (100) for speed, and field speed
      retest 0.78, 0.76, 0.75, 0.74.

eta:
  headline:
    value: ke
    note: >
      The Explosion Efficiency Gap is 1 − η_KE, η_KE = E_field / E_lab on
      kinetic energy per kg = η_speed² (the README definition). Speed is the
      clean channel: within position, log η_speed tracks the field value
      (r 0.71) more than the lab one (r −0.23; with the exposure-free season
      value the bigger engines reach a smaller fraction, which top3 hid),
      while burst and power η are mostly the inverse of the noisy lab value
      (r −0.70, −0.72). Burst and power η are stored and reported, not part
      of the gap (decided 2026-10-22; reports/eta.md).
  role:
    value: stratify
    note: >
      η is stored raw. Position explains ~2/3 of speed-η variance (OL 0.73 →
      DB 0.88), so leaderboards are read within position group and Iteration 4
      stratifies Cox models by position group (risk sets within a group), so
      position never enters as a covariate (decided 2026-10-22, open decision 3).
  career_weight:
    value: plays
    note: >
      Career η per prospect = exp of the plays-weighted mean of season log η
      over qualified seasons. The first qualified season's η is kept as well:
      a career value uses later seasons, so it is look-ahead for survival.

outcomes:
  last_season:
    value: 2025
    note: >
      Last regular season in the competition data. Careers are right-censored
      here: a prospect with no play in it has exited only if they played
      before (src/eeg/outcomes/table.py).
  primary:
    value: playing_time
    note: >
      Main regular-season outcome for every group: playing time (plays per
      season, zeros kept). Covers all 510 prospects, including those who never
      played, and is the team's own verdict. Compared within group only (WR/TE
      plays are routes). Decided 2026-10-22, open decision 1
      (reports/production.md).
  draft_control:
    value: [pick, udfa]
    note: >
      Draft slot as a control: overall pick (undrafted set to 258) plus an
      undrafted indicator. Within group × draft class it explains playing
      time best out of sample (CV R² 0.51 vs 0.50 round bands, 0.47 log pick;
      reports/output.md). Decided 2026-10-22 (open decision 2).
  production:
    value: {WR: yprr, TE: yprr, DL: pressure_rate, OL: peak_pressure_prob}
    note: >
      Secondary outcome, one per group, picked on within-group split-half
      reliability and on tracking playing time: YPRR (WR 0.85, TE 0.80),
      pressure rate (DL 0.67), peak pressure probability allowed (OL 0.77,
      lower is better; the binary pressure-allowed rate is 0.35). DB has none:
      player_play has no coverage outcome for the defender, and tackle rate is
      unrelated to playing time (r 0.00). Exists only for qualified seasons.
  realization:
    value: [get_off]
    note: >
      Production measures that are in-game explosion rather than output, used
      alongside η (steps 4-5): DL get-off time (split-half 0.89, season retest
      0.84, faster with earlier picks).
  tenure:
    value: secondary
    note: >
      League exit (played, then no play in any later season through
      last_season) stays a secondary outcome: 48 exits among 260 prospects at
      risk, at most three seasons, and 2024-debut exits rest on one missed
      season. Kaplan-Meier plus Cox stratified by position group with the
      draft control, one measure at a time, and observed vs expected exits in
      each measure's tail (reports/tenure.md). Decided 2026-10-22 (open
      decision 3).

figures:
  example_prospect:
    value: {player_id: 55942, label: "An edge rusher from the 2023 class, 250 lb"}
    note: >
      The prospect in the physics figure (src/eeg/viz/figures.py, figure 1):
      top of the explosive tail (raw joules) in his group and class, a clean
      tracked 40, and a mid-round pick who outplayed his slot. Described, not
      named, in committed outputs.
