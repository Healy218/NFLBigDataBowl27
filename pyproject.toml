[project]
name = "eeg"
version = "0.1.0"
description = "Explosion Efficiency Gap: Combine drills to mechanical energy to NFL performance"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars",
    "pandas",
    "pyarrow",
    "numpy",
    "scipy",
    "scikit-learn",
    "lifelines",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "plotly>=7.1.0",
]

[dependency-groups]
dev = [
    "jupyter",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eeg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
